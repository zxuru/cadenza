name: build

# Every artifact is built on the machine that can build it: PyInstaller cannot
# cross-compile a desktop executable, and neither can `flet build` - its own
# platform matrix allows windows on Windows, macos on macOS and linux on Linux
# only. Android is the one target that builds anywhere, so an APK comes from a
# Linux runner, where `flet build` installs its own Flutter, JDK 17 and Android
# SDK.
#
# iOS and the web are deliberately not built; BUILD.md says why.
#
# Every push to `main` publishes a release, so the newest release is always the
# code that was pushed last and an installed app has something to update itself
# to (see update.py). The version comes from the `version` job: `v1.2.3` for a
# tag, `v<major>.<minor>.<run number>` for a push.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A commit that only rewrites prose does not need six runners; tag pushes
    # are exempt from path filters, so a release still builds everything.
    paths-ignore: ["**/*.md", "packaging/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
      tag: ${{ steps.number.outputs.tag }}
      build: ${{ steps.number.outputs.build }}
      publish: ${{ steps.number.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # The patch is the run number, which only grows: no two builds of the
      # same base version are ordered randomly, which is what the app's
      # updater needs to tell a newer release from an older one.
      - name: Work out the version this run publishes
        id: number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(python3 -c 'import version; print(version.BASE_VERSION)')"
            version="${base%.*}.$GITHUB_RUN_NUMBER"
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "This run publishes v$version" >> "$GITHUB_STEP_SUMMARY"

  # Both builds wait for this job, so a build that does not lint and does not
  # pass its tests never becomes a release. It costs a couple of minutes and
  # catches what `--selftest --no-download` cannot: the selftest walks the
  # engine in one direction and never runs the code around it, which is where
  # an undefined name reached a release (`MATCH_RETRY_GIVE_UP`, 1.0.15) and
  # crashed a download on the user's machine.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # The pyflakes rules (see `[tool.ruff.lint]` in pyproject.toml): an
      # undefined name, an import nothing uses. Cheap, and first.
      - name: Lint
        run: ruff check .

      # The runner image has the ffmpeg the tests synthesize their audio with;
      # on one that did not, those tests skip rather than fail. The tests that
      # would need YouTube are deselected by pyproject.toml.
      - name: Test
        run: pytest -q

  desktop:
    name: desktop (${{ matrix.name }})
    needs: [version, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, asset: linux-x86_64.tar.gz }
          - { name: linux-arm64, os: ubuntu-24.04-arm, asset: linux-arm64.tar.gz }
          - { name: windows-x86_64, os: windows-latest, asset: windows-x86_64.exe }
          - { name: macos-arm64, os: macos-latest, asset: macos-arm64.zip }
          - { name: macos-x86_64, os: macos-15-intel, asset: macos-x86_64.zip }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # `build.py` stamps the version into `_buildinfo.py` before PyInstaller
      # runs, so the executable knows which release it is and can tell whether
      # the feed has a newer one.
      - name: Build
        env:
          CADENZA_VERSION: ${{ needs.version.outputs.version }}
        run: python build.py

      # The frozen build checks itself: ffmpeg, the JavaScript runtime, the
      # yt-dlp extractor registry and mutagen. --no-download leaves out
      # everything that needs YouTube to cooperate - a CI runner is answered
      # "Sign in to confirm you're not a bot", for single videos and often for
      # the search too, which says nothing about the build. Run `--selftest`
      # without the flag on a real machine; BUILD.md shows what it prints.
      #
      # The version line is checked too: a build that lost its stamp would
      # report the base version, look older than it is, and update itself in a
      # loop.
      - name: Verify
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          binary=dist/Cadenza
          if [ "${{ runner.os }}" = "macOS" ]; then
            binary=dist/Cadenza.app/Contents/MacOS/Cadenza
          elif [ "${{ runner.os }}" = "Windows" ]; then
            binary=dist/Cadenza.exe
          fi
          output="$(mktemp)"
          status=0
          "$binary" --selftest --no-download >"$output" 2>&1 || status=$?
          # A windowed build has no console to print to: it leaves the report
          # in selftest.txt next to where it ran.
          report="$(cat "$output" selftest.txt 2>/dev/null || true)"
          echo "$report"
          if [ "$status" != 0 ]; then
            exit 1
          fi
          if ! grep -qE "^version +${VERSION}$" <<<"$report"; then
            echo "::error::the build does not report version $VERSION"
            exit 1
          fi

      # A tarball keeps the executable bit; `ditto` keeps the permissions and
      # symlinks an .app bundle is made of. The release file is named for what
      # it is and what it holds: `Cadenza-1.0.16-windows-x86_64.exe` - a browser
      # saves it under a name that says which app and which version it is, and
      # `update.py` finds it by the platform part that follows the version.
      - name: Package
        shell: bash
        run: |
          asset="Cadenza-${{ needs.version.outputs.version }}-${{ matrix.asset }}"
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --sequesterRsrc --keepParent dist/Cadenza.app \
                "$asset"
              ;;
            Linux)
              tar -czf "$asset" -C dist Cadenza
              ;;
            Windows)
              cp dist/Cadenza.exe "$asset"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: Cadenza-${{ needs.version.outputs.version }}-${{ matrix.asset }}

  android:
    name: android (apk)
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Flutter, the JDK and the Android SDK are ~2 GB and change only when
      # pyproject.toml does: the target SDK and the app's Android dependencies
      # both live there. `restore-keys` keeps that true when an edit to
      # pyproject.toml does not concern them at all - a test section, a comment -
      # so the previous toolchain is the one to start from and only a real change
      # to it costs the download: a cold toolchain turns every run into the first
      # one this build has ever had.
      - uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/java
            ~/Android/sdk
          key: flet-toolchain-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            flet-toolchain-${{ runner.os }}-

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]==1.0.0"

      # The APK carries the same version stamp the desktop builds do, and tells
      # Android about it: `versionCode` is what makes an install over the old
      # one an upgrade rather than a refusal.
      #
      # `--split-per-abi` writes one APK per architecture instead of one fat
      # package: the three sets of native libraries (Flutter's, Python's, and
      # ffmpeg's) are what the fat APK is made of, so a phone downloads the ~110
      # MB that fit it instead of 230 MB of which two thirds never run.
      #
      # The one step that has failed by itself, with nothing the code did wrong:
      # serious_python fetches Python through gradle-download-task, which caches
      # its ETags in `build/download-task/etags.json` - written in place rather
      # than moved into place, and read back by the download that follows. A file
      # caught between the two reads as "Unable to determine the current
      # character ... index number 255" and every download after it fails, while
      # the archive that file guards answers 200 the whole time. It holds nothing
      # but a validator, so the repair is to throw it out and ask once more.
      - name: Build APKs
        run: |
          python version.py --stamp "${{ needs.version.outputs.version }}"

          build() {
            flet build apk --yes --split-per-abi \
              --build-version "${{ needs.version.outputs.version }}" \
              --build-number "${{ needs.version.outputs.build }}"
          }

          if ! build; then
            echo "::warning::the build failed; clearing the ETag cache and going again"
            find build -name etags.json -delete 2>/dev/null || true
            build
          fi

          # The release file says which app and which version it is:
          # `cadenza-1.0.16-arm64-v8a.apk`, which `update.py` finds by the ABI
          # that follows the version (and which `adb install` takes as it is).
          version="${{ needs.version.outputs.version }}"
          for apk in build/apk/*.apk; do
            name="$(basename "$apk")"
            mv "$apk" "build/apk/cadenza-${version}-${name#cadenza-}"
          done
          ls -l build/apk/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # `flet build` names them `cadenza-<abi>.apk`, which is what the
          # updater looks for. The copies in build/apk, not the Gradle output
          # they were copied from: both match `build/**/*.apk`, and shipping
          # the same files twice helps nobody.
          path: build/apk/*.apk
          if-no-files-found: error

  release:
    name: release
    needs: [version, desktop, android]
    # Android is best-effort: the release waits for it (so its APKs ship when
    # the build is healthy) but only the desktop builds gate it - a failed
    # APK build must not cancel the release.
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # What `update.py` checks a download against before installing it.
      - name: List the digests of every artifact
        run: |
          (cd artifacts && sha256sum */* | sed 's|  .*/|  |') > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun of the same run number: the release is already there.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              artifacts/*/* SHA256SUMS
            exit 0
          fi
          # On a push the tag does not exist yet - the release creates it, at
          # the commit this run built; a tag push brought its own.
          target=()
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Cadenza v$VERSION" --generate-notes "${target[@]}" \
            artifacts/*/* SHA256SUMS
